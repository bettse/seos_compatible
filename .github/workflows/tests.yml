name: "Host tests"

on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    name: 'make test-host'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install mbedTLS
        run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - name: Run host tests
        run: make test-host
